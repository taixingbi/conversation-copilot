<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>conversation-copilot</title>
  <script>
    document.documentElement.dataset.theme = localStorage.getItem("overlay-theme") === "black" ? "black" : "white";
  </script>
  <style>
    :root { --sidebar-width: 46%; }
    [data-theme="black"] {
      --bg: #1c1c1e;
      --line: rgba(255, 255, 255, 0.1);
      --muted: #98989d;
      --text: #f5f5f7;
      --title: #f5f5f7;
      --input: #1c1c1e;
      --card: #2c2c2e;
      --card-current: #3a3a3c;
      --accent: #0a84ff;
      --ok: #30d158;
      --ext: #64d2ff;
      --hairline: rgba(255, 255, 255, 0.1);
      --chip: rgba(255, 255, 255, 0.08);
      --btn: rgba(255, 255, 255, 0.08);
      --label: #98989d;
      --draft: #d1d1d6;
      --save-fg: #fff;
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }
    :root, [data-theme="white"] {
      --bg: #f6f6f7;
      --line: rgba(0, 0, 0, 0.08);
      --muted: #6e6e73;
      --text: #1d1d1f;
      --title: #1d1d1f;
      --input: #ffffff;
      --card: #ffffff;
      --card-current: #ffffff;
      --accent: #007aff;
      --ok: #34c759;
      --ext: #007aff;
      --hairline: rgba(0, 0, 0, 0.08);
      --chip: rgba(0, 0, 0, 0.06);
      --btn: rgba(0, 0, 0, 0.05);
      --label: #6e6e73;
      --draft: #6e6e73;
      --save-fg: #fff;
      --shadow: 0 10px 32px rgba(0, 0, 0, 0.12);
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      overflow: hidden;
    }
    .wrap {
      box-sizing: border-box;
      height: 100%;
      padding: 10px;
      display: flex;
      flex-direction: column;
    }
    .panel {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex: 1;
      overflow: hidden;
    }
    .body {
      position: relative;
      display: flex;
      flex-direction: row;
      min-height: 0;
      flex: 1;
    }
    .body:has(#qa.open, #summary.open, #chat.open) .main { margin-right: var(--sidebar-width); }
    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      flex: 1;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px 8px;
      border-bottom: 1px solid var(--line);
      -webkit-app-region: drag;
    }
    .hdr-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    header strong {
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--title);
    }
    .hdr-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      -webkit-app-region: no-drag;
    }
    .icon-btn {
      appearance: none;
      background: var(--btn);
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 8px;
      width: 26px;
      height: 26px;
      font: 13px/1 inherit;
      cursor: pointer;
      padding: 0;
    }
    .icon-btn:hover, .icon-btn.on { color: var(--text); background: rgba(255, 255, 255, 0.12); }
    .win-btns {
      display: flex;
      align-items: center;
      gap: 4px;
      -webkit-app-region: no-drag;
    }
    #win-min, #win-close {
      font-size: 13px;
      line-height: 1;
    }
    #win-close {
      color: #fecaca;
      background: rgba(248, 113, 113, 0.22);
      border-color: rgba(248, 113, 113, 0.4);
    }
    #win-close:hover { color: #fff; background: rgba(248, 113, 113, 0.4); }
    html.is-fullscreen .wrap { padding: 0; }
    html.is-fullscreen .panel { border-radius: 0; }
    #qa-toggle, #sum-toggle, #chat-toggle { width: auto; padding: 0 8px; font-size: 11px; font-weight: 600; }
    #qa-toggle.on, #sum-toggle.on, #chat-toggle.on {
      color: #fff;
      background: var(--ok);
      border-color: var(--ok);
    }
    #qa-toggle.on:hover, #sum-toggle.on:hover, #chat-toggle.on:hover { color: #fff; background: #24b84b; }
    #summary, #qa, #chat {
      display: flex;
      flex-direction: column;
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 5;
      width: 0;
      min-width: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--bg);
      border-left: 0;
      box-shadow: none;
      -webkit-app-region: no-drag;
      flex: 0 0 auto;
      pointer-events: none;
      transition: width 0.2s ease;
    }
    #summary.open, #qa.open, #chat.open {
      width: var(--sidebar-width);
      box-sizing: border-box;
      border-left: 1px solid var(--line);
      pointer-events: auto;
    }
    #summary .cfg-hd,
    #summary #sum-text,
    #summary .cfg-foot {
      min-width: 0;
    }
    #qa-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-wrap: anywhere;
    }
    #qa-status {
      padding: 10px 12px;
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }
    #sum-text {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 10px 12px;
      overflow-wrap: anywhere;
    }
    #sum-text:empty::before {
      content: "No summary yet";
      color: var(--muted);
    }
    #ready-status { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
    #dot { width: 8px; height: 8px; border-radius: 50%; background: #8e8e93; }
    #dot.on { background: #4ade80; }
    .cfg-backdrop {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 15;
      background: rgba(0, 0, 0, 0.28);
      -webkit-app-region: no-drag;
    }
    [data-theme="white"] .cfg-backdrop { background: rgba(0, 0, 0, 0.16); }
    .panel.cfg-open .cfg-backdrop { display: block; }
    #settings {
      display: flex;
      flex-direction: column;
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: var(--sidebar-width);
      min-width: 0;
      box-sizing: border-box;
      z-index: 20;
      margin: 0;
      padding: 0;
      background: var(--bg);
      border-left: 1px solid var(--line);
      box-shadow: -8px 0 24px rgba(0, 0, 0, 0.18);
      -webkit-app-region: no-drag;
      transform: translateX(100%);
      transition: transform 0.22s ease;
      pointer-events: none;
    }
    #settings.open {
      transform: translateX(0);
      pointer-events: auto;
    }
    .cfg-hd {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px 8px;
      border-bottom: 1px solid var(--line);
    }
    .cfg-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--title);
    }
    .cfg-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 4px 12px 10px;
    }
    .cfg-foot {
      padding: 8px 12px 12px;
      border-top: 1px solid var(--line);
    }
    .cfg-sec {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0 10px 8px;
      margin: 8px 0;
    }
    .cfg-sec summary {
      cursor: pointer;
      padding: 8px 0;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--title);
      list-style: none;
    }
    .cfg-sec summary::-webkit-details-marker { display: none; }
    .cfg-sec summary::after {
      content: "▸";
      float: right;
      color: var(--muted);
    }
    .cfg-sec[open] summary::after { content: "▾"; }
    #settings label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--label);
      margin: 8px 0 4px;
    }
    #settings textarea {
      min-height: 72px;
      resize: vertical;
    }
    #settings input, #settings select, #settings textarea {
      width: 100%;
      box-sizing: border-box;
      background: var(--input);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 9px;
      font: 12px/1.4 inherit;
    }
    #cfg-conf-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #cfg-conf { flex: 1; padding: 0; }
    #cfg-conf-val {
      min-width: 2.6em;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }
    #settings .row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
    }
    #settings .row button {
      appearance: none;
      border: 0;
      border-radius: 8px;
      padding: 7px 12px;
      font: 12px/1 inherit;
      cursor: pointer;
    }
    #cfg-save { background: var(--accent); color: var(--save-fg); font-weight: 600; }
    #cfg-clear { background: var(--btn); color: var(--title); }
    .themes {
      display: flex;
      gap: 8px;
    }
    .theme-dot {
      appearance: none;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--line);
      padding: 0 10px;
      cursor: pointer;
      background: var(--btn);
      color: var(--text);
      font: 12px/1 inherit;
    }
    .theme-dot::before {
      content: "";
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--swatch);
      border: 1px solid var(--line);
    }
    .theme-dot[data-theme="black"] { --swatch: #1c1c1e; }
    .theme-dot[data-theme="white"] { --swatch: #f5f5f7; }
    .theme-dot.on { border-color: var(--accent); color: var(--accent); }
    #cfg-note { margin-top: 8px; font-size: 11px; color: var(--muted); min-height: 1.2em; }
    #current {
      padding: 10px 10px 8px;
      flex: 0 0 auto;
    }
    #history {
      padding: 0 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .qa-card {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr);
      gap: 4px 10px;
      padding: 36px 14px 14px;
      border-radius: 10px;
      background: var(--card);
      position: relative;
    }
    .qa-card.current {
      background: var(--card-current);
      border-left: 3px solid var(--accent);
    }
    .qa-card:not(.current) { opacity: 0.92; }
    .q-label, .a-label {
      font-weight: 700;
      font-size: 13px;
      padding-top: 2px;
    }
    .q-label { color: var(--accent); }
    .a-label { color: var(--ok); }
    .q-text, .a-text {
      color: var(--text);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
    }
    .q-text {
      border-bottom: 1px solid var(--hairline);
      padding-bottom: 8px;
      margin-bottom: 8px;
    }
    .qa-badge {
      position: absolute;
      top: 8px;
      right: 34px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted);
      background: var(--chip);
      border-radius: 999px;
      padding: 2px 7px;
    }
    .qa-del {
      position: absolute;
      top: 6px;
      right: 8px;
      width: 22px;
      height: 22px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
      font: 16px/1 inherit;
      cursor: pointer;
      padding: 0;
    }
    .qa-del:hover { color: #fecaca; background: rgba(248, 113, 113, 0.12); }
    .dots::after {
      content: ".";
      animation: dots 1s steps(3, end) infinite;
    }
    @keyframes dots {
      0% { content: "."; }
      33% { content: ".."; }
      66% { content: "..."; }
    }
    #tx-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
    }
    #tx-toggle {
      background: none;
      border: 0;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      padding: 0;
    }
    #tx-toggle:hover { color: var(--text); }
    #tx-last {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.7;
    }
    #transcript, #sum-text, #chat-messages {
      font-size: 11px;
      line-height: 1.4;
      color: var(--text);
    }
    #transcript {
      display: none;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 4px 12px 8px;
      border-top: 1px solid var(--line);
    }
    #transcript.open { display: block; }
    #transcript .t { display: flex; align-items: baseline; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
    .tx-meta { display: inline-flex; flex-shrink: 0; align-items: baseline; gap: 8px; color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
    .tx-speaker { border-radius: 4px; background: var(--chip); padding: 1px 5px; font-weight: 600; }
    .t.ext .tx-speaker { color: var(--ext); }
    .tx-body { flex: 1; min-width: 0; white-space: pre-wrap; }
    .rich-text { white-space: normal; overflow-wrap: anywhere; }
    .rich-text p { margin: 0 0 0.65em; white-space: pre-wrap; }
    .rich-text ul, .rich-text ol { margin: 0 0 0.65em; padding-left: 1.5em; }
    .rich-text li { margin: 0.25em 0; }
    .rich-text .text-heading { font-weight: 600; margin-top: 0.8em; }
    .rich-text code { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.92em; background: var(--chip); border-radius: 4px; padding: 1px 4px; }
    .rich-text pre { white-space: pre; overflow-x: auto; max-width: 100%; margin: 0.6em 0; padding: 10px; background: var(--chip); border-radius: 8px; }
    .rich-text pre code { padding: 0; background: transparent; }
    .rich-text > :last-child { margin-bottom: 0; }
    button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (max-width: 480px) {
      .wrap { padding: 4px; }
      .hdr-actions { gap: 4px; }
      .body:has(#qa.open, #summary.open, #chat.open) .main { visibility: hidden; }
      #qa.open, #summary.open, #chat.open, #settings { width: 100%; }
    }
    footer {
      padding: 4px 12px 7px;
      color: var(--muted);
      font-size: 10px;
      border-top: 1px solid var(--line);
    }
    #chat-messages { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 16px; color: var(--text); font-size: 13px; line-height: 1.6; }
    #chat-messages:empty { display: grid; place-content: center; text-align: center; }
    #chat-messages:empty::before { content: "What would you like to know?"; font-size: 17px; font-weight: 600; }
    #chat-messages:empty::after { content: "Ask anything about this conversation."; color: var(--muted); font-size: 12px; margin-top: 8px; }
    .chat-message { margin-bottom: 24px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .chat-message.user { margin-left: auto; width: fit-content; max-width: 85%; border-radius: 18px; padding: 10px 14px; background: var(--card-current); }
    .chat-message.assistant { padding: 0 2px; }
    .chat-copy { display: block; margin-top: 8px; padding: 2px 0; border: 0; background: none; color: var(--muted); font-size: 11px; cursor: pointer; }
    .chat-copy:hover { color: var(--text); }
    #chat-form { margin: 0 12px 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 20px; background: var(--card); }
    #chat-form:focus-within { border-color: var(--muted); }
    #chat-input { display: block; width: 100%; box-sizing: border-box; resize: none; min-height: 42px; max-height: 150px; font: inherit; font-size: 13px; line-height: 1.5; color: var(--text); background: transparent; border: 0; outline: none; padding: 4px 0; }
    .chat-composer-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    #chat-send { flex-shrink: 0; width: 30px; height: 30px; border: 0; border-radius: 50%; background: var(--text); color: var(--bg); font-size: 20px; cursor: pointer; }
    #chat-send:disabled { opacity: 0.35; cursor: default; }
    #chat-status { color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="panel">
      <header>
        <div class="hdr-left">
          <div class="win-btns">
            <button id="win-min" class="icon-btn" type="button" title="Minimize">─</button>
            <button id="win-close" class="icon-btn" type="button" title="Close">×</button>
          </div>
        </div>
        <div class="hdr-actions">
          <button id="qa-toggle" class="icon-btn" type="button" title="Q&A" aria-controls="qa" aria-expanded="false">QA</button>
          <button id="sum-toggle" class="icon-btn" type="button" title="Summary" aria-controls="summary" aria-expanded="false">Summary</button>
          <button id="chat-toggle" class="icon-btn" type="button" title="Chat about the conversation" aria-controls="chat" aria-expanded="false">Chat</button>
          <button id="cfg-toggle" class="icon-btn" type="button" title="Settings">⚙</button>
          <span id="ready-status" role="status" aria-live="polite" aria-label="Starting…" title="Starting…"><span id="dot" aria-hidden="true"></span></span>
        </div>
      </header>
      <div class="body">
        <div class="cfg-backdrop" id="cfg-backdrop"></div>
        <form id="settings" autocomplete="off" inert>
          <div class="cfg-hd">
            <div class="cfg-title">Config</div>
            <button id="cfg-close" class="icon-btn" type="button" title="Close">×</button>
          </div>
          <div class="cfg-scroll">
            <details class="cfg-sec" open>
              <summary>Appearance</summary>
              <label>Theme</label>
              <div id="cfg-themes" class="themes" role="group" aria-label="Theme">
                <button type="button" class="theme-dot" data-theme="black">Mac Black</button>
                <button type="button" class="theme-dot" data-theme="white">Light</button>
              </div>
            </details>
            <details class="cfg-sec">
              <summary>Q&amp;A</summary>
              <label for="cfg-llm">Model</label>
              <input id="cfg-llm" name="llm_model" type="text" spellcheck="false" readonly />
              <label for="cfg-prompt">Prompt</label>
              <textarea id="cfg-prompt" name="prompt" spellcheck="true"></textarea>
            </details>
            <details class="cfg-sec">
              <summary>Summary</summary>
              <label for="cfg-sum-model">Model</label>
              <input id="cfg-sum-model" name="summary_model" type="text" spellcheck="false" readonly />
              <label for="cfg-sum-prompt">Prompt</label>
              <textarea id="cfg-sum-prompt" name="summary_prompt" spellcheck="true"></textarea>
            </details>
            <details class="cfg-sec">
              <summary>Chat</summary>
              <label for="cfg-chat-model">Model</label>
              <input id="cfg-chat-model" type="text" readonly />
              <label for="cfg-chat-prompt">Prompt</label>
              <textarea id="cfg-chat-prompt" name="chat_prompt" spellcheck="true" maxlength="8000" placeholder="Leave empty to use the default prompt"></textarea>
            </details>
            <details class="cfg-sec">
              <summary>Transcription</summary>
              <label for="cfg-whisper">Whisper model</label>
              <select id="cfg-whisper" name="whisper_model"></select>
              <label for="cfg-conf">Recognition confidence</label>
              <div id="cfg-conf-row">
                <input id="cfg-conf" name="recognition_confidence" type="range" min="0.30" max="0.95" step="0.01" />
                <span id="cfg-conf-val">0.70</span>
              </div>
            </details>
          </div>
          <div class="cfg-foot">
            <div class="row">
              <button id="cfg-clear" type="button">Clear all</button>
              <button id="cfg-save" type="submit">Save</button>
            </div>
            <div id="cfg-note"></div>
          </div>
        </form>
        <div class="main">
          <div id="tx-bar">
            <button id="tx-toggle" type="button" aria-label="Toggle transcript" title="Toggle transcript" aria-controls="transcript" aria-expanded="true">▾</button>
            <span id="tx-last"></span>
          </div>
          <div id="transcript" class="open"></div>
          <footer id="lat"></footer>
        </div>
        <aside id="qa" aria-label="Q&A" inert>
          <div class="cfg-hd">
            <div class="cfg-title">Q&amp;A</div>
            <button id="qa-hide" class="icon-btn" type="button" title="Close Q&A" aria-label="Close Q&A">×</button>
          </div>
          <div id="qa-status" role="status" aria-live="polite">Q&amp;A is off. Open QA to start.</div>
          <div id="qa-content">
            <div id="current"></div>
            <div id="history"></div>
          </div>
        </aside>
        <aside id="chat" aria-label="Conversation chat" inert>
          <div class="cfg-hd">
            <div class="cfg-title">Chat</div>
            <button id="chat-hide" class="icon-btn" type="button" title="Close Chat" aria-label="Close Chat">×</button>
          </div>
          <div id="chat-messages" role="log" aria-live="polite"></div>
          <form id="chat-form">
            <textarea id="chat-input" aria-label="Question about the conversation" placeholder="Ask anything about this conversation" rows="1" maxlength="8000" required></textarea>
            <div class="chat-composer-actions">
              <div id="chat-status" role="status"></div>
              <button id="chat-send" type="submit" title="Send message" aria-label="Send message" disabled>↑</button>
            </div>
          </form>
        </aside>
        <aside id="summary" inert>
          <div class="cfg-hd">
            <div class="cfg-title">Summary</div>
            <button id="sum-hide" class="icon-btn" type="button" title="Delete">×</button>
          </div>
          <div id="sum-text"></div>
        </aside>
      </div>
    </section>
  </div>
  <script>
    const currentBox = document.getElementById("current");
    const historyBox = document.getElementById("history");
    const transcript = document.getElementById("transcript");
    const txToggle = document.getElementById("tx-toggle");
    const txLast = document.getElementById("tx-last");
    const lat = document.getElementById("lat");
    const dot = document.getElementById("dot");
    const readyStatus = document.getElementById("ready-status");
    function setReady(ready, text) {
      dot.classList.toggle("on", ready);
      const label = ready ? "Ready" : text;
      readyStatus.setAttribute("aria-label", label);
      readyStatus.title = label;
    }
    const panel = document.querySelector(".panel");
    const settings = document.getElementById("settings");
    const cfgToggle = document.getElementById("cfg-toggle");
    const cfgClose = document.getElementById("cfg-close");
    const cfgBackdrop = document.getElementById("cfg-backdrop");
    const winMin = document.getElementById("win-min");
    const winClose = document.getElementById("win-close");
    const cfgLlm = document.getElementById("cfg-llm");
    const cfgWhisper = document.getElementById("cfg-whisper");
    const cfgNote = document.getElementById("cfg-note");
    const cfgClear = document.getElementById("cfg-clear");
    const cfgPrompt = document.getElementById("cfg-prompt");
    const cfgSumModel = document.getElementById("cfg-sum-model");
    const cfgChatModel = document.getElementById("cfg-chat-model");
    const cfgChatPrompt = document.getElementById("cfg-chat-prompt");
    const cfgSumPrompt = document.getElementById("cfg-sum-prompt");
    const cfgConf = document.getElementById("cfg-conf");
    const cfgConfVal = document.getElementById("cfg-conf-val");
    const cfgThemes = document.getElementById("cfg-themes");
    const chatBox = document.getElementById("chat");
    const chatToggle = document.getElementById("chat-toggle");
    const chatInput = document.getElementById("chat-input");
    const chatMessages = document.getElementById("chat-messages");
    const chatStatus = document.getElementById("chat-status");
    const chatSend = document.getElementById("chat-send");
    const chatForm = document.getElementById("chat-form");
    let chatBusy = false;
    let chatHistory = [];
    let qaEnabled = false;
    const qaStatus = document.getElementById("qa-status");
    const qaToggle = document.getElementById("qa-toggle");
    const qaHide = document.getElementById("qa-hide");
    const qaBox = document.getElementById("qa");
    const sumToggle = document.getElementById("sum-toggle");
    let summaryPending = false;
    const sumHide = document.getElementById("sum-hide");
    const summaryBox = document.getElementById("summary");
    const sumText = document.getElementById("sum-text");
    let current = null;
    let whisperDirty = false;
    const seenEv = new Set();
    let lastTx = "";
    let socket = null;
    let socketTimer = 0;
    const cards = new Map();
    const deletedAt = new Map();
    let sumWanted = false;
    let sumCleared = false;

    txToggle.addEventListener("click", () => {
      const open = transcript.classList.toggle("open");
      txToggle.textContent = open ? "▾" : "▸";
      txToggle.setAttribute("aria-expanded", String(open));
    });
    function setConfigOpen(open) {
      settings.classList.toggle("open", open);
      panel.classList.toggle("cfg-open", open);
      cfgToggle.classList.toggle("on", open);
      settings.inert = !open;
      if (open) {
        setChatOpen(false);
        setSummaryOpen(false);
        setQaOpen(false);
        loadConfig();
      }
    }
    function setQaOpen(open) {
      qaBox.classList.toggle("open", open);
      qaToggle.classList.toggle("on", open);
      qaToggle.setAttribute("aria-expanded", String(open));
      qaBox.inert = !open;
      if (open) {
        setChatOpen(false);
        setSummaryOpen(false);
        setConfigOpen(false);
      }
    }
    function setSummaryOpen(open) {
      summaryBox.classList.toggle("open", open);
      panel.classList.toggle("sum-open", open);
      sumToggle.classList.toggle("on", open);
      sumToggle.setAttribute("aria-expanded", String(open));
      summaryBox.inert = !open;
      if (open) {
        setChatOpen(false);
        sumWanted = true;
        setQaOpen(false);
        setConfigOpen(false);
      } else {
        sumWanted = false;
      }
    }
    function setChatOpen(open) {
      chatBox.classList.toggle("open", open);
      chatToggle.classList.toggle("on", open);
      chatToggle.setAttribute("aria-expanded", String(open));
      chatBox.inert = !open;
      if (open) {
        setQaOpen(false);
        setSummaryOpen(false);
        setConfigOpen(false);
        chatInput.focus();
      }
    }
    function renderChat(messages) {
      chatMessages.replaceChildren();
      for (const message of messages) {
        const row = document.createElement("div");
        row.className = "chat-message " + (message.role === "user" ? "user" : "assistant");
        row.setAttribute("aria-label", message.role === "user" ? "You" : "Chat");
        const text = document.createElement("div");
        if (message.role === "user") text.textContent = message.content;
        else renderText(text, message.content);
        row.append(text);
        if (message.role === "assistant") {
          const copy = document.createElement("button");
          copy.type = "button";
          copy.className = "chat-copy";
          copy.textContent = "Copy";
          copy.setAttribute("aria-label", "Copy answer");
          copy.addEventListener("click", async () => {
            try {
              await navigator.clipboard.writeText(message.content);
              copy.textContent = "Copied";
              setTimeout(() => { copy.textContent = "Copy"; }, 1500);
            } catch { chatStatus.textContent = "Could not copy. Select the answer to copy it."; }
          });
          row.append(copy);
        }
        chatMessages.appendChild(row);
      }
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    chatToggle.addEventListener("click", () => setChatOpen(!chatBox.classList.contains("open")));
    document.getElementById("chat-hide").addEventListener("click", () => {
      setChatOpen(false);
      chatToggle.focus();
    });
    fetch("/api/chat").then(res => {
      if (!res.ok) throw new Error("Could not load chat history");
      return res.json();
    }).then(body => {
      if (!chatBusy && !chatHistory.length) {
        chatHistory = body.messages || [];
        renderChat(chatHistory);
      }
    }).catch(() => {});
    function updateChatComposer() {
      chatSend.disabled = chatBusy || !chatInput.value.trim();
      chatInput.style.height = "auto";
      chatInput.style.height = Math.min(chatInput.scrollHeight, 150) + "px";
    }
    chatInput.addEventListener("input", updateChatComposer);
    chatInput.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        chatForm.requestSubmit();
      }
    });
    chatForm.addEventListener("submit", async event => {
      event.preventDefault();
      const question = chatInput.value.trim();
      if (!question || chatBusy) return;
      chatBusy = true;
      chatSend.disabled = true;
      chatInput.readOnly = true;
      chatStatus.textContent = "Thinking…";
      renderChat([...chatHistory, {role: "user", content: question}]);
      try {
        const res = await fetch("/api/chat", {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({question}),
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body.error || "Chat failed");
        chatHistory = body.messages;
        renderChat(chatHistory);
        chatInput.value = "";
        chatStatus.textContent = "";
      } catch (error) {
        chatStatus.textContent = error.message || "Chat failed. Try again.";
        renderChat(chatHistory);
      } finally {
        chatBusy = false;
        updateChatComposer();
        chatInput.readOnly = false;
        if (chatBox.classList.contains("open")) chatInput.focus();
      }
    });
    cfgToggle.addEventListener("click", () => {
      setConfigOpen(!settings.classList.contains("open"));
    });
    cfgClose.addEventListener("click", () => setConfigOpen(false));
    cfgBackdrop.addEventListener("click", () => {
      setConfigOpen(false);
    });
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      setChatOpen(false);
      setConfigOpen(false);
      setSummaryOpen(false);
      setQaOpen(false);
    });
    qaToggle.addEventListener("click", () => {
      const open = !qaBox.classList.contains("open");
      setQaOpen(open);
      if (open) setQaEnabled(true);
    });
    qaHide.addEventListener("click", () => {
      setQaOpen(false);
      qaToggle.focus();
    });
    sumToggle.addEventListener("click", () => {
      const open = !summaryBox.classList.contains("open");
      setSummaryOpen(open);
      if (open && !summaryPending) startSummary();
    });
    function setFullscreenUI(on) {
      document.documentElement.classList.toggle("is-fullscreen", !!on);
    }
    winMin.addEventListener("click", () => {
      if (window.copilot && typeof window.copilot.minimize === "function") {
        window.copilot.minimize();
      }
    });
    winClose.addEventListener("click", () => {
      if (window.copilot && typeof window.copilot.quit === "function") {
        window.copilot.quit();
        return;
      }
      window.close();
    });
    if (window.copilot && typeof window.copilot.onFullscreen === "function") {
      window.copilot.onFullscreen(setFullscreenUI);
      if (typeof window.copilot.isFullscreen === "function") {
        window.copilot.isFullscreen().then(setFullscreenUI).catch(() => {});
      }
    }
    document.addEventListener("fullscreenchange", () => {
      setFullscreenUI(!!document.fullscreenElement);
    });
    settings.addEventListener("submit", (e) => {
      e.preventDefault();
      saveConfig();
    });
    cfgClear.addEventListener("click", () => {
      clearAllCards(true);
    });
    sumHide.addEventListener("click", () => clearSummary());
    cfgConf.addEventListener("input", () => {
      cfgConfVal.textContent = Number(cfgConf.value).toFixed(2);
    });
    cfgThemes.addEventListener("click", (e) => {
      const btn = e.target.closest(".theme-dot");
      if (!btn) return;
      applyTheme(btn.dataset.theme, true);
      fetch("/api/config", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ theme: btn.dataset.theme }),
      }).catch(() => {});
    });

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }
    // Build formatted content with DOM text nodes; model output never becomes HTML.
    function renderText(target, value) {
      target.replaceChildren();
      target.classList.add("rich-text");
      function inline(parent, text) {
        for (const part of text.split(/(\*\*[^*\n]+\*\*|`[^`\n]+`)/g)) {
          if (!part) continue;
          const bold = part.startsWith("**") && part.endsWith("**");
          const code = part.startsWith("`") && part.endsWith("`");
          if (bold || code) {
            const el = document.createElement(bold ? "strong" : "code");
            el.textContent = part.slice(bold ? 2 : 1, bold ? -2 : -1);
            parent.appendChild(el);
          } else parent.appendChild(document.createTextNode(part));
        }
      }
      let list = null, paragraph = null, code = null;
      for (const line of String(value || "").split("\n")) {
        if (line.trim().startsWith("```")) {
          list = paragraph = null;
          if (code) code = null;
          else {
            const pre = document.createElement("pre");
            code = document.createElement("code");
            pre.appendChild(code);
            target.appendChild(pre);
          }
          continue;
        }
        if (code) { code.textContent += line + "\n"; continue; }
        if (!line.trim()) { list = paragraph = null; continue; }
        const item = line.match(/^\s*(?:([-*])|\d+[.)])\s+(.+)$/);
        if (item) {
          paragraph = null;
          const tag = item[1] ? "UL" : "OL";
          if (!list || list.tagName !== tag) {
            list = document.createElement(tag.toLowerCase());
            target.appendChild(list);
          }
          const li = document.createElement("li");
          inline(li, item[2]);
          list.appendChild(li);
          continue;
        }
        list = null;
        const heading = line.match(/^#{1,6}\s+(.+)$/);
        if (heading || !paragraph) {
          paragraph = document.createElement("p");
          target.appendChild(paragraph);
        } else paragraph.appendChild(document.createTextNode("\n"));
        if (heading) paragraph.className = "text-heading";
        inline(paragraph, heading ? heading[1] : line);
        if (heading) paragraph = null;
      }
    }
    function fmtMs(ms) {
      if (ms == null || ms === "") return "";
      const n = Number(ms);
      if (!Number.isFinite(n)) return "";
      if (n < 0) return "prefetch";
      if (n >= 1000) return (n / 1000).toFixed(1) + "s";
      return Math.round(n) + "ms";
    }
    function badgeText(ev) {
      return fmtMs(ev.ext_ms != null ? ev.ext_ms : ev.ttft_ms);
    }
    function makeCard(isCurrent) {
      const el = document.createElement("div");
      el.className = "qa-card" + (isCurrent ? " current" : "");
      el.innerHTML =
        `<span class="qa-badge" hidden></span>` +
        `<button class="qa-del" type="button" title="Delete" aria-label="Delete">×</button>` +
        `<div class="q-label">Q</div><div class="q-text"></div>` +
        `<div class="a-label">A</div><div class="a-text"><span class="dots"></span></div>`;
      return el;
    }
    function fillCard(el, ev) {
      const draft = ev.kind === "draft" || ev.kind === "fast";
      el.classList.toggle("draft", draft);
      el.querySelector(".q-text").textContent = ev.question || "";
      el.querySelector(".q-label").textContent = ev.mode === "extraction" ? "CURRENT QUESTION" : "Q";
      el.querySelector(".a-label").textContent = ev.mode === "extraction" ? "CONTEXT" : "A";
      const aEl = el.querySelector(".a-text");
      if (ev.mode === "extraction") {
        aEl.textContent = ev.context || "";
      } else if (ev.answer) {
        renderText(aEl, ev.answer);
      } else {
        aEl.innerHTML = '<span class="dots"></span>';
      }
      const badge = el.querySelector(".qa-badge");
      const text = badgeText(ev);
      if (text) {
        badge.hidden = false;
        badge.textContent = text;
      }
    }
    function normQ(q) {
      return String(q || "").toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g, " ").trim();
    }
    function sameQuestion(prev, next) {
      const a = normQ(prev);
      const b = normQ(next);
      if (!a || !b) return !b;
      if (a === b) return true;
      return false;
    }
    function rememberCard(card) {
      const key = normQ(card.q);
      if (key) cards.set(key, card);
    }
    function findCard(q) {
      const n = normQ(q);
      if (!n) return current;
      if (cards.has(n)) return cards.get(n);
      for (const [k, card] of cards) {
        if (sameQuestion(k, n)) return card;
      }
      if (current && sameQuestion(current.q, q)) return current;
      return null;
    }
    function archiveCurrent() {
      if (!current) return;
      current.el.classList.remove("current");
      historyBox.prepend(current.el);
      rememberCard(current);
      current = null;
    }
    function cardFromEl(el) {
      if (current && current.el === el) return current;
      for (const card of cards.values()) {
        if (card.el === el) return card;
      }
      return null;
    }
    function forgetCardKeys(card) {
      for (const [k, c] of [...cards]) {
        if (c === card) cards.delete(k);
      }
    }
    function recentlyDeleted(q) {
      const n = normQ(q);
      if (!n) return false;
      const t = deletedAt.get(n);
      if (!t) return false;
      if (Date.now() - t > 4000) {
        deletedAt.delete(n);
        return false;
      }
      return true;
    }
    function removeCard(card, notify) {
      if (!card) return;
      const q = card.q || "";
      if (normQ(q)) deletedAt.set(normQ(q), Date.now());
      forgetCardKeys(card);
      card.el.remove();
      if (current === card) {
        current = null;
        currentBox.replaceChildren();
      }
      if (notify) {
        fetch("/api/qa/delete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q }),
        }).catch(() => {});
      }
    }
    function clearAllCards(notify) {
      for (const card of [...cards.values()]) removeCard(card, false);
      if (current) removeCard(current, false);
      cards.clear();
      currentBox.replaceChildren();
      historyBox.replaceChildren();
      if (notify) {
        fetch("/api/qa/delete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: "" }),
        }).catch(() => {});
      }
    }
    function setQaUI(on) {
      const changed = qaEnabled !== !!on;
      qaEnabled = !!on;
      if (!on) qaStatus.textContent = "Q&A is off. Open QA to start.";
      else if (changed) qaStatus.textContent = "Listening for a question…";
    }
    async function setQaEnabled(on) {
      const previous = qaEnabled;
      setQaUI(on);
      try {
        const res = await fetch("/api/qa", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ enabled: !!on }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          setQaUI(previous);
          lat.textContent = body.error || "QA toggle failed";
          qaStatus.textContent = body.error || "QA toggle failed";
          return;
        }
        if (body.qa_enabled != null) setQaUI(body.qa_enabled);
      } catch (e) {
        setQaUI(previous);
        lat.textContent = "QA toggle failed";
        qaStatus.textContent = "QA toggle failed. Check the app connection and try again.";
      }
    }
    function showSummary(text, pending) {
      if (sumCleared) return;
      sumText.classList.toggle("pending", !!pending);
      renderText(sumText, text || "");
      if (sumWanted) setSummaryOpen(true);
    }
    function clearSummary() {
      sumCleared = true;
      sumWanted = false;
      summaryPending = false;
      sumText.textContent = "";
      sumText.classList.remove("pending");
      setSummaryOpen(false);
      fetch("/api/summary/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: "{}",
      }).catch(() => {});
    }
    async function startSummary() {
      sumCleared = false;
      sumWanted = true;
      summaryPending = true;
      showSummary("Starting summary…", true);
      try {
        const res = await fetch("/api/summary", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: "{}",
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          showSummary(body.error || "Summary failed", false);
          summaryPending = false;
        }
      } catch (e) {
        showSummary("Summary failed", false);
        summaryPending = false;
      }
    }
    function applyTheme(name, persist) {
      const raw = String(name || "white").toLowerCase();
      const theme = raw === "black" || raw === "dark" || raw === "mac-black" || raw === "mac black" ? "black" : "white";
      document.documentElement.dataset.theme = theme;
      cfgThemes.querySelectorAll(".theme-dot").forEach((btn) => {
        btn.classList.toggle("on", btn.dataset.theme === theme);
      });
      if (persist) {
        try { localStorage.setItem("overlay-theme", theme); } catch (e) {}
      }
    }
    function fillConfig(cfg, preferServerTheme) {
      if (!cfg) return;
      if (cfg.theme && preferServerTheme) applyTheme(cfg.theme, true);
      if (cfg.llm_model) cfgLlm.value = cfg.llm_model;
      const opts = cfg.whisper_options || [];
      if (opts.length && cfgWhisper.options.length !== opts.length) {
        cfgWhisper.innerHTML = opts.map((m) => `<option value="${esc(m)}">${esc(m)}</option>`).join("");
      }
      if (cfg.whisper_model && !whisperDirty) cfgWhisper.value = cfg.whisper_model;
      if (cfg.prompt != null) cfgPrompt.value = cfg.prompt;
      if (cfg.summary_model) cfgSumModel.value = cfg.summary_model;
      if (cfg.chat_model) cfgChatModel.value = cfg.chat_model;
      if (cfg.chat_prompt != null) cfgChatPrompt.value = cfg.chat_prompt;
      if (cfg.summary_prompt != null) cfgSumPrompt.value = cfg.summary_prompt;
      if (cfg.recognition_confidence != null) {
        cfgConf.value = String(cfg.recognition_confidence);
        cfgConfVal.textContent = Number(cfg.recognition_confidence).toFixed(2);
      }
      cfgWhisper.disabled = !!cfg.whisper_loading;
      if (cfg.whisper_loading) cfgNote.textContent = "Loading Whisper " + cfg.whisper_model + "…";
      if (cfg.qa_enabled != null) setQaUI(cfg.qa_enabled);
    }
    async function loadConfig() {
      try {
        const res = await fetch("/api/config");
        const cfg = await res.json();
        fillConfig(cfg, !localStorage.getItem("overlay-theme"));
      } catch (e) {
        cfgNote.textContent = "Could not load settings";
      }
    }
    async function saveConfig() {
      cfgNote.textContent = "Saving…";
      try {
        const res = await fetch("/api/config", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            whisper_model: cfgWhisper.value,
            theme: document.documentElement.dataset.theme || "white",
            prompt: cfgPrompt.value,
            summary_prompt: cfgSumPrompt.value,
            chat_prompt: cfgChatPrompt.value,
            recognition_confidence: Number(cfgConf.value),
          }),
        });
        const cfg = await res.json();
        if (!res.ok) {
          cfgNote.textContent = cfg.error || "Save failed";
          return;
        }
        fillConfig(cfg, true);
        cfgNote.textContent = cfg.whisper_loading
          ? "Saved. Loading Whisper " + cfg.whisper_model + "…"
          : "Saved";
      } catch (e) {
        cfgNote.textContent = "Save failed";
      }
    }
    panel.addEventListener("click", (e) => {
      const btn = e.target.closest(".qa-del");
      if (!btn) return;
      e.preventDefault();
      removeCard(cardFromEl(btn.closest(".qa-card")), true);
    });
    function onEvent(ev) {
      // Readiness is a current snapshot, including after reconnecting.
      if (ev.type === "readiness") {
        setReady(ev.ready === true, ev.text || "Starting…");
        return;
      }
      if (ev.t != null) {
        const id = `${ev.t}:${ev.type}:${ev.label || ""}:${ev.text || ev.question || ""}`;
        if (seenEv.has(id)) return;
        seenEv.add(id);
        if (seenEv.size > 400) {
          const drop = [...seenEv].slice(0, 200);
          for (const key of drop) seenEv.delete(key);
        }
      }
      if (ev.type === "transcript") {
        const line = `${ev.ts}|${ev.label}|${ev.text || ""}`;
        if (line === lastTx) return;
        lastTx = line;
        let row = ev.utterance_id && [...transcript.children].find(r => r.dataset.utteranceId === ev.utterance_id);
        if (row && ev.phase === "final" && !ev.text) {
          row.remove();
          return;
        }
        const existing = !!row;
        if (!row) row = document.createElement("div");
        if (ev.utterance_id) row.dataset.utteranceId = ev.utterance_id;
        row.style.opacity = ev.phase === "partial" ? "0.65" : "1";
        const ext = String(ev.label || "").startsWith("EXT");
        row.className = "t" + (ext ? " ext" : "");
        row.innerHTML = `<div class="tx-meta"><span>${esc(ev.ts)}</span><span class="tx-speaker">${esc(ev.label)}</span></div><div class="tx-body">${esc(ev.text)}</div>`;
        const follow = transcript.scrollHeight - transcript.scrollTop - transcript.clientHeight < 48;
        if (!existing) transcript.appendChild(row);
        if (follow) transcript.scrollTop = transcript.scrollHeight;
        txLast.textContent = `[${ev.label}] ${ev.text || ""}`;
      } else if (ev.type === "qa_status") {
        qaStatus.textContent = ev.text || "";
      } else if (ev.type === "qa") {
        const draft = ev.kind === "draft" || ev.kind === "fast";
        const q = ev.question || "";
        if (recentlyDeleted(q)) return;
        let card = (ev.replaces_question && findCard(ev.replaces_question)) || findCard(q);
        if (card) {
          if (q && normQ(q) !== normQ(card.q)) {
            cards.delete(normQ(card.q));
            card.q = q;
          } else if (q) {
            card.q = q;
          }
          rememberCard(card);
          fillCard(card.el, ev);
          if (ev.done && !draft) card.done = true;
          return;
        }
        if (current && q && current.q && !sameQuestion(current.q, q)) archiveCurrent();
        if (!current) {
          const el = makeCard(true);
          currentBox.replaceChildren(el);
          current = { el, q, done: false };
        }
        current.q = q || current.q;
        rememberCard(current);
        fillCard(current.el, ev);
        if (ev.done && !draft) current.done = true;
      } else if (ev.type === "lat") {
        lat.textContent = ev.text || "";
        if (current) {
          const badge = current.el.querySelector(".qa-badge");
          const text = badgeText(ev);
          if (text) {
            badge.hidden = false;
            badge.textContent = text;
          }
        }
      } else if (ev.type === "summary") {
        showSummary(ev.text || "", !ev.done);
        if (ev.done) summaryPending = false;
      } else if (ev.type === "summary_gone") {
        sumCleared = true;
        sumWanted = false;
        summaryPending = false;
        sumText.textContent = "";
        sumText.classList.remove("pending");
        setSummaryOpen(false);
      } else if (ev.type === "status") {
        if (!lat.textContent) lat.textContent = ev.text || "";
        if (settings.classList.contains("open") && ev.text) cfgNote.textContent = ev.text;
      } else if (ev.type === "config") {
        fillConfig(ev);
      } else if (ev.type === "qa_gone") {
        const q = ev.question || "";
        if (!q) {
          clearAllCards(false);
          return;
        }
        const card = findCard(q);
        if (card) removeCard(card, false);
      }
    }

    function connect() {
      if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
        return;
      }
      const proto = location.protocol === "https:" ? "wss" : "ws";
      const ws = new WebSocket(proto + "://" + location.host + "/ws");
      socket = ws;
      ws.onopen = () => { setReady(false, "Starting…"); };
      ws.onclose = () => {
        if (socket === ws) socket = null;
        setReady(false, "Reconnecting…");
        clearTimeout(socketTimer);
        socketTimer = setTimeout(connect, 800);
      };
      ws.onerror = () => ws.close();
      ws.onmessage = (m) => {
        try { onEvent(JSON.parse(m.data)); } catch (e) {}
      };
    }
    applyTheme(localStorage.getItem("overlay-theme") || "white", false);
    loadConfig();
    connect();
  </script>
</body>
</html>
